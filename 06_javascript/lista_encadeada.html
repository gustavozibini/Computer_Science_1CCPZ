  Lista encadeada simples, feita em JavaScript puro.
    valores[]  -> guarda os nomes
    proximo[]  -> guarda o ÍNDICE do próximo item (-1 = fim da lista)
    inicio / ultimo -> índices do primeiro e do último item
  Obs.: a função de remover um elemento específico está comentada (ver mais abaixo);
  o botão "Remover Elemento" chama remover(), que ainda não foi escrita neste arquivo.
-->

    <h1>Lista Encadeada (simples)</h1>
    <label for="nome">Digite o nome: </label>
    <input type="text" id="nome" placeholder = "Digite um nome">
    <br>
    <button onclick="adicionarFim()">Adicionar no fim</button>
    <button onclick="adicionarInicio()">Adicionar no Inicio</button>
    <button onclick="removerInicio()">Remover Inicio</button>
    <br>
    <button onclick="contar()">Contar Elementos</button>
    <button onclick="remover()">Remover Elemento</button>
    <button onclick="mostrar()">Mostrar Lista</button>

    <div id="saida"></div>

    <script>
        // lista encadeada: veja a explicação no comentário do topo do arquivo

        let valores = [];
        let proximo = [];
        let inicio = -1;
        let ultimo= -1;

        // Adiciona no fim: o antigo último passa a apontar para o novo item
        function adicionarFim() {
            let nome = document.getElementById('nome').value;
            if (nome === "") {
                alert("Digite um nome");
                return;
            }
            let novoIndice = valores.length;
            valores.push(nome);
            proximo.push(-1);
            if(inicio === -1) {
                inicio = novoIndice;
                ultimo = novoIndice;
            }
            else {
                proximo[ultimo] = novoIndice;
                ultimo = novoIndice;
            }

            document.getElementById('nome').value = "";
            alert("Elemento Adicionado");
            mostrar();
        }

        // Adiciona no início: o novo item aponta para o antigo primeiro
        function adicionarInicio() {
            let nome = document.getElementById('nome').value;
            if (nome === "") {
                alert("Digite um nome");
                return;
            }
            let novoIndice = valores.length;
            valores.push(nome);
            proximo.push(inicio);
            inicio = novoIndice;
            if(ultimo === -1) {
                ultimo = novoIndice;
            }
            document.getElementById('nome').value = "";
            alert("Elemento Adicionado");
            mostrar();
        }

        // Remove o primeiro: o "inicio" passa a ser o próximo item
        function removerInicio() {
            if (inicio === -1) {
                alert("Lista vazia");
                return;
            }
            inicio = proximo[inicio];
            if (inicio === -1) {
                ultimo = -1;
            }
            mostrar();
        }

        // Conta andando pela lista do início até o -1
        function contar() {
            let quantidade = 0;
            let atual = inicio;
            while (atual !== -1) {
                quantidade++;
                atual = proximo[atual];
            }
            document.getElementById('saida').innerHTML = "Quantidade de elementos: " + quantidade;
        }

        // Mostra a lista na tela, do início até "null"
        function mostrar() {
            let resultado = "";
            let atual = inicio;
        while (atual !== -1) {
            resultado += valores[atual] + " -> ";
            atual = proximo[atual];
        }
        if (inicio === -1) {
                resultado = "Lista Vazia";
            }
            else {
                resultado += "null";
            }

            document.getElementById('saida').innerHTML = resultado;

        }
